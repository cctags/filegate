name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all process, browser and fuzz checks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      basic: ${{ steps.scope.outputs.basic }}
      process: ${{ steps.scope.outputs.process }}
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-scope.sh "$BASE" >> "$GITHUB_OUTPUT"
      - name: Check whitespace
        run: git diff --check

  checks:
    needs: scope
    if: needs.scope.outputs.basic == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/validate.yml
    with:
      process: ${{ needs.scope.outputs.process == 'true' }}
      browser: ${{ needs.scope.outputs.browser == 'true' }}
      full: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}

  result:
    if: always()
    needs: [scope, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          test "$SCOPE" = success
          test "$CHECKS" = success || test "$CHECKS" = skipped

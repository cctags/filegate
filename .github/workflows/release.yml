name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish (for example v0.2.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: metadata
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          commit=$(bash scripts/resolve-release.sh "$VERSION")
          git checkout --detach "$commit"
          bash scripts/validate-release.sh "$VERSION"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  validate:
    needs: metadata
    uses: ./.github/workflows/validate.yml
    with:
      full: true
      commit: ${{ needs.metadata.outputs.commit }}

  build:
    needs: [metadata, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            mode: native
          - arch: arm64
            runner: ubuntu-24.04-arm
            mode: native
          - arch: riscv64
            runner: ubuntu-24.04
            mode: qemu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install RISC-V user-mode emulator
        if: matrix.mode == 'qemu'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user
          qemu-riscv64 --version
      - name: Package and run release smoke tests
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ARCH: ${{ matrix.arch }}
          MODE: ${{ matrix.mode }}
        run: |
          test "$(id -u)" -ne 0
          if [[ "$MODE" == native ]]; then test "$(go env GOHOSTARCH)" = "$ARCH"; fi
          bash scripts/package-release.sh "$VERSION" "$ARCH"
          bash scripts/smoke-release.sh "$VERSION" "$ARCH" "$MODE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: tmp/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  assemble:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: tmp/dist
          merge-multiple: true
      - name: Assemble checksums and release notes
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          bash scripts/release-notes.sh "$VERSION" > tmp/dist/RELEASE_NOTES.md
          cd tmp/dist
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3
          # Keep checksums internal to Actions; publish only the three archives.
          sha256sum "filegate_${VERSION}_linux_amd64.tar.gz" "filegate_${VERSION}_linux_arm64.tar.gz" \
            "filegate_${VERSION}_linux_riscv64.tar.gz" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: tmp/dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [metadata, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: tmp/dist
      - name: Publish release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$VERSION" --jq .sha)" = "$COMMIT"
          cd tmp/dist
          sha256sum --check SHA256SUMS
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$VERSION" --verify-tag --title "Filegate $VERSION" \
            --notes-file RELEASE_NOTES.md "${flags[@]}" \
            "filegate_${VERSION}_linux_amd64.tar.gz" "filegate_${VERSION}_linux_arm64.tar.gz" \
            "filegate_${VERSION}_linux_riscv64.tar.gz"

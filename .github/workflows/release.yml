name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: metadata
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          bash scripts/validate-release.sh "$VERSION"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    needs: metadata
    uses: ./.github/workflows/validate.yml
    with:
      full: true

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Package and smoke test on native architecture
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(id -u)" -ne 0
          test "$(go env GOHOSTARCH)" = "$ARCH"
          bash scripts/package-release.sh "$VERSION" "$ARCH"
          bash scripts/smoke-release.sh "$VERSION" "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: tmp/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: tmp/dist
          merge-multiple: true
      - name: Assemble checksums and release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          bash scripts/release-notes.sh "$VERSION" > tmp/dist/RELEASE_NOTES.md
          cd tmp/dist
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          sha256sum "filegate_${VERSION}_linux_amd64.tar.gz" "filegate_${VERSION}_linux_arm64.tar.gz" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: tmp/dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [metadata, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: tmp/dist
      - name: Publish release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$VERSION" --jq .sha)" = "$COMMIT"
          cd tmp/dist
          sha256sum --check SHA256SUMS
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$VERSION" --verify-tag --title "Filegate $VERSION" \
            --notes-file RELEASE_NOTES.md "${flags[@]}" \
            "filegate_${VERSION}_linux_amd64.tar.gz" "filegate_${VERSION}_linux_arm64.tar.gz" SHA256SUMS
